# ─────────────────────────────────────────────────────────────────
# GPT-2 Style Config  (matches buildanllm.com GPT-2 preset)
# Swappable: pos_encoding, norm, activation, attention, optimizer
# ─────────────────────────────────────────────────────────────────
name: gpt2_style
description: "Learned positional embeddings + LayerNorm + GELU (GPT-2)"

model:
  vocab_size: 50257          # override with tokenizer vocab if custom
  d_model: 256
  n_heads: 8
  n_layers: 6
  d_ff: 1024
  max_seq: 512
  dropout: 0.1

  # ── Swappable components ───────────────────────────────────────
  pos_encoding: learned      # learned | rope | alibi | none
  norm_type: layernorm       # layernorm | rmsnorm
  activation: gelu           # gelu | swiglu | relu
  attention_type: standard   # standard | flash | grouped_query
  use_moe: false             # false | true
  moe:
    num_experts: 8
    top_k: 2
    shared_experts: 0

training:
  optimizer: adamw           # adamw | lion | sophia | adafactor
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  batch_size: 32
  gradient_accumulation: 1
  max_steps: 5000
  eval_every: 200
  save_every: 500
  warmup_steps: 200
  lr_schedule: cosine        # cosine | linear | wsd | constant
  precision: fp32            # fp32 | fp16 | bf16 | int8 | int4

dataset:
  name: tinystories          # tinystories | openwebtext | custom | alpaca | wikitext
  path: null                 # path to custom dataset
  train_split: 0.9
  block_size: 512

logging:
  wandb: false
  log_every: 50
  plot_attention: true
  plot_grad_norms: true
